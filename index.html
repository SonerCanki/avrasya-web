      (function (k) {
        k.add('js');
        if (matchMedia('(prefers-reduced-motion: no-preference)').matches) k.add('hareketli');
        addEventListener('error', function (o) {
          if (o.target && o.target.tagName === 'SCRIPT') k.remove('js', 'hareketli');
        }, true);
      })(document.documentElement.classList);
    </script>
